# ScottyLabs Documentation Projects
#
# IMPORTANT: Most projects are automatically discovered from governance.
# Projects with `docs: true` flag in governance are automatically included.
#
# This file is for:
# 1. The central org-level documentation repository (when created)
# 2. Manual overrides for projects not in governance
# 3. External documentation sources

# Central ScottyLabs organization documentation (migrated from GitHub wiki)
[[project]]
slug = "scottylabs"
name = "ScottyLabs"
repo = "https://codeberg.org/scottylabs/documentation"
type = "starlight"
docs_dir = "org-docs/scottylabs"
description = "Organization-wide guides, processes, and resources"

# Projects with `docs: true` in governance are auto-discovered
# No need to add them here unless you want to override defaults

# Example configurations for manual additions:

# Starlight project (Markdown documentation)
# [[project]]
# slug = "example-docs"
# name = "Example Project"
# repo = "https://codeberg.org/scottylabs/example-project"
# type = "starlight"
