<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excalidraw viewer</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <link rel="stylesheet" href="/excalidraw/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import { Excalidraw } from 'https://esm.sh/@excalidraw/excalidraw@0.18.1?deps=react@18.3.1,react-dom@18.3.1';

      const params = new URLSearchParams(window.location.search);
      const scenePath = params.get('scene') ?? '/diagrams/tech-stack.excalidraw.json';
      const response = await fetch(scenePath);

      if (!response.ok) {
        document.body.innerHTML = `<p style="padding:1rem;font-family:sans-serif">Failed to load diagram: ${scenePath}</p>`;
        throw new Error(`Failed to load ${scenePath}`);
      }

      const scene = await response.json();
      let excalidrawAPI = null;
      let viewportMode = 'embedded';

      function applyViewport(mode) {
        if (!excalidrawAPI) {
          return;
        }

        viewportMode = mode;

        if (mode === 'fullscreen') {
          excalidrawAPI.updateScene({
            appState: {
              zoom: { value: 1 },
              scrollX: 80,
              scrollY: 40,
            },
          });
          return;
        }

        excalidrawAPI.scrollToContent(undefined, { fitToViewport: true });
      }

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) {
          return;
        }
        if (event.data?.type === 'excalidraw-viewport') {
          applyViewport(event.data.mode);
        }
      });

      createRoot(document.getElementById('root')).render(
        React.createElement(Excalidraw, {
          initialData: scene,
          viewModeEnabled: true,
          zenModeEnabled: false,
          gridModeEnabled: false,
          excalidrawAPI: (api) => {
            excalidrawAPI = api;
            applyViewport(viewportMode);
          },
          UIOptions: {
            canvasActions: {
              changeViewBackgroundColor: false,
              clearCanvas: false,
              export: false,
              loadScene: false,
              saveToActiveFile: false,
              toggleTheme: true,
              saveAsImage: true,
            },
          },
        }),
      );
    </script>
  </body>
</html>
