# Copy to governance repository: .forgejo/workflows/trigger-docs-rebuild.yml
# Requires DOCS_TRIGGER_TOKEN secret (see .forgejo/README.md).

name: Trigger Documentation Rebuild

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'

jobs:
  trigger-docs:
    runs-on: docker
    steps:
      - name: Notify documentation hub of governance changes
        env:
          DOCS_TRIGGER_TOKEN: ${{ secrets.DOCS_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          echo "🔔 Triggering documentation rebuild..."
          curl -fsS -X POST \
            -H "Authorization: token ${DOCS_TRIGGER_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            https://codeberg.org/api/v1/repos/scottylabs/documentation/dispatches \
            -d '{"event_type": "governance-updated"}'
          echo "✅ Documentation rebuild triggered"
