name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [governance-updated]

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build documentation
        run: bun run build
        env:
          NODE_ENV: production

      - name: Install Nix
        if: github.ref == 'refs/heads/main'
        uses: https://github.com/DeterminateSystems/nix-installer-action@v16

      - name: Upload to Garage
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          nix shell nixpkgs#awscli2 --command bash -c '
            export AWS_ACCESS_KEY_ID="$GARAGE_ACCESS_KEY"
            export AWS_SECRET_ACCESS_KEY="$GARAGE_SECRET_KEY"
            export AWS_DEFAULT_REGION=us-east-1

            if ! aws s3 ls "s3://$GARAGE_BUCKET/" \
              --endpoint-url "$GARAGE_ENDPOINT" >/dev/null 2>&1; then
              echo "::error::Garage credentials rejected (No such key / AccessDenied)."
              echo "Ensure tofu-garage has been applied and Forgejo secrets match:"
              echo "  GARAGE_ENDPOINT=https://s3.scottylabs.org"
              echo "  GARAGE_ACCESS_KEY / GARAGE_SECRET_KEY from tofu output scottylabs_docs_writer_*"
              echo "Do not reuse scottylabs_assets_writer credentials."
              exit 1
            fi

            aws s3 sync dist/ "s3://$GARAGE_BUCKET/" \
              --endpoint-url "$GARAGE_ENDPOINT" \
              --region us-east-1 \
              --delete \
              --cache-control "public, max-age=3600"
          '
        env:
          GARAGE_ENDPOINT: ${{ secrets.GARAGE_ENDPOINT }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          GARAGE_BUCKET: scottylabs-docs
