name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allow manual triggers and triggers from other repositories
  workflow_dispatch:
  repository_dispatch:
    types: [governance-updated]

jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Build documentation
        run: bun run build
        env:
          NODE_ENV: production
      
      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: dist/
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: dist/
      
      - name: Setup Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Upload to Garage
        run: nix run .#upload-garage
        env:
          GARAGE_ENDPOINT: ${{ secrets.GARAGE_ENDPOINT }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          GARAGE_BUCKET: scottylabs-docs
