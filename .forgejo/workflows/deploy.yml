name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [governance-updated]

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build documentation
        run: bun run build
        env:
          NODE_ENV: production

      - name: Install Nix
        if: github.ref == 'refs/heads/main'
        uses: https://github.com/DeterminateSystems/nix-installer-action@v16

      - name: Upload to Garage
        if: github.ref == 'refs/heads/main'
        run: nix run .#upload-garage -- dist
        env:
          GARAGE_ENDPOINT: ${{ secrets.GARAGE_ENDPOINT }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          GARAGE_BUCKET: scottylabs-docs
