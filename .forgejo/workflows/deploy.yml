name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [governance-updated]

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build documentation
        run: bun run build
        env:
          NODE_ENV: production

      - name: Install Nix
        if: github.ref == 'refs/heads/main'
        uses: https://github.com/DeterminateSystems/nix-installer-action@v16

      - name: Upload to Garage
        if: github.ref == 'refs/heads/main'
        env:
          GARAGE_ENDPOINT: ${{ secrets.GARAGE_ENDPOINT }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          GARAGE_BUCKET: scottylabs-docs
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail

          if [ -z "${GARAGE_ACCESS_KEY:-}" ] || [ -z "${GARAGE_SECRET_KEY:-}" ] || [ -z "${GARAGE_ENDPOINT:-}" ]; then
            echo "::error::Garage secrets are missing or empty in Forgejo (Settings → Actions → Secrets)."
            exit 1
          fi

          echo "Checking Garage access (bucket=${GARAGE_BUCKET}, endpoint=${GARAGE_ENDPOINT})..."
          if ! nix shell nixpkgs#awscli2 --command aws s3 ls "s3://${GARAGE_BUCKET}/" \
            --endpoint-url "${GARAGE_ENDPOINT}" \
            --region us-east-1; then
            echo "::error::Garage credentials rejected."
            echo "On infra-01, verify the key exists:"
            echo "  sudo tofu -chdir=/var/lib/tofu-garage state list | grep scottylabs_docs"
            echo "Then re-copy secrets from:"
            echo "  tofu output -raw scottylabs_docs_writer_access_key_id"
            echo "  tofu output -raw scottylabs_docs_writer_secret_access_key"
            echo "GARAGE_ENDPOINT must be https://s3.scottylabs.org (not garage.scottylabs.org)."
            exit 1
          fi

          nix shell nixpkgs#awscli2 --command aws s3 sync dist/ "s3://${GARAGE_BUCKET}/" \
            --endpoint-url "${GARAGE_ENDPOINT}" \
            --region us-east-1 \
            --delete \
            --exclude "*.html" \
            --exclude "*.md" \
            --cache-control "public, max-age=31536000, immutable"

          nix shell nixpkgs#awscli2 --command aws s3 sync dist/ "s3://${GARAGE_BUCKET}/" \
            --endpoint-url "${GARAGE_ENDPOINT}" \
            --region us-east-1 \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --include "*.md" \
            --cache-control "public, max-age=0, must-revalidate"
